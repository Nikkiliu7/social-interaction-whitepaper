<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社交互动体验白皮书</title>
    <meta name="description" content="可交互、可筛选、可点菜的跨品类社交互动设计模式库。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c5cff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <canvas id="bg-particles" class="bg-particles" aria-hidden="true"></canvas>

    <header class="app-header">
      <button class="app-header__brand" type="button" data-action="go-home" title="返回首页">
        <span class="app-header__mark" aria-hidden="true"></span>
        <span>
          <span class="app-header__title">社交互动体验白皮书</span>
          <span class="app-header__sub" id="header-subtitle">加载中…</span>
        </span>
      </button>

      <div class="app-header__spacer"></div>

      <div class="app-header__actions">
        <button class="btn btn--sm app-header__desktop-only" type="button" data-action="browse-all">
          浏览全部
        </button>
        <button class="btn btn--sm" type="button" data-action="open-basket">
          我的清单 <span id="header-basket-count">0</span>
        </button>
        <button
          class="btn btn--icon"
          type="button"
          data-action="toggle-particles"
          id="particles-toggle"
          title="背景动效开关"
          aria-pressed="true"
        >
          <span aria-hidden="true">✦</span>
          <span class="sr-only">背景动效开关</span>
        </button>
      </div>
    </header>

    <main class="app-main" id="app" tabindex="-1">
      <div class="page">
        <div class="empty-state">正在加载数据…</div>
      </div>
    </main>

    <div class="basket-bar" id="basket-bar" hidden></div>

    <footer class="app-footer" id="app-footer"></footer>

    <div class="drawer" id="filter-drawer" data-open="false" aria-hidden="true"></div>
    <div class="modal" id="modal-root" data-open="false" aria-hidden="true"></div>
    <div class="lightbox" id="lightbox" data-open="false" aria-hidden="true"></div>
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script type="module" src="assets/js/main.js"></script>
    <noscript>
      <div class="page">
        <div class="banner banner--error">本页面需要启用 JavaScript 才能使用。</div>
      </div>
    </noscript>
  </body>
</html>
